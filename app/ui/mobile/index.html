<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07080e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JON" />
  <title>JON Mobile</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

      <small>Si cet ecran reste affiche, recharge la page ou ouvre le lien dans Chrome/Safari.</small>

    </div>

  <!-- Self-contained bundle (React bundled locally, no CDN dependency) -->
  <script defer src="bundle.js"></script>

</html>
